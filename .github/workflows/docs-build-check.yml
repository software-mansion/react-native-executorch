name: Check documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build-check.yml'
      # The API reference is generated by typedoc from the library sources
      # (docusaurus.config.js entryPoints), so a src-only change alters the
      # published docs even when nothing under docs/ moves.
      - 'packages/react-native-executorch/src/**'
      - 'packages/react-native-executorch/tsconfig.doc.json'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build-check.yml'
      # The API reference is generated by typedoc from the library sources
      # (docusaurus.config.js entryPoints), so a src-only change alters the
      # published docs even when nothing under docs/ moves.
      - 'packages/react-native-executorch/src/**'
      - 'packages/react-native-executorch/tsconfig.doc.json'
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
jobs:
  check:
    if: github.repository == 'software-mansion/react-native-executorch'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-check-${{ github.ref }}
      cancel-in-progress: true
    env:
      WORKING_DIRECTORY: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn install --immutable
      - name: Generate docs
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build
