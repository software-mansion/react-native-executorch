name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish_docs.yml'
      - 'docs/**'
      # The API reference is generated by typedoc from the library sources
      # (docusaurus.config.js entryPoints), so a src-only change alters the
      # published docs even when nothing under docs/ moves.
      - 'packages/react-native-executorch/src/**'
      - 'packages/react-native-executorch/tsconfig.doc.json'
  workflow_dispatch:
jobs:
  publish:
    if: github.repository == 'software-mansion/react-native-executorch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Generate docs
        run: >-
          git config --local user.email "action@github.com"
          && git config --local user.name "GitHub Action"
          && cd docs
          && yarn
          && yarn build

      - name: Publish generated content to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          FOLDER: docs/build
          BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
