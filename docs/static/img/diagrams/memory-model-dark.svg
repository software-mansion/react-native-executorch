<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="t d"><title id="t">The memory model</title><desc id="d">JavaScript heap holds lightweight Tensor and Model handles that point across the JSI boundary to buffers and compiled programs on the native C++ heap, which the JavaScript garbage collector cannot see.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7394ff"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c49ffe"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#abbcf5"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7adead"/></marker></defs><rect x="24" y="56" width="372" height="268" rx="14" fill="#272b3c" stroke="#3851b4" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="484" y="56" width="372" height="268" rx="14" fill="#473d68" stroke="#b07eff" stroke-width="1.2" stroke-dasharray="6 6"/><text x="210" y="40" fill="#abbcf5" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">JavaScript heap</text><text x="670" y="40" fill="#c49ffe" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Native C++ heap</text><rect x="96" y="96" width="228" height="76" rx="12" fill="#2b3048" stroke="#7394ff" stroke-width="1.5"/><text x="210" y="128" fill="#eef0ff" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" text-anchor="middle">Tensor</text><text x="210" y="150" fill="#7485bd" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" text-anchor="middle">handle</text><rect x="96" y="212" width="228" height="76" rx="12" fill="#2b3048" stroke="#7394ff" stroke-width="1.5"/><text x="210" y="244" fill="#eef0ff" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" text-anchor="middle">Model</text><text x="210" y="266" fill="#7485bd" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" text-anchor="middle">handle</text><rect x="512" y="96" width="316" height="76" rx="12" fill="#2b3048" stroke="#c49ffe" stroke-width="1.5"/><text x="670" y="128" fill="#eef0ff" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">float32 buffer</text><text x="670" y="150" fill="#7485bd" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="middle">1 x 3 x 224 x 224   ~588 KB</text><line x1="330" y1="134" x2="506" y2="134" stroke="#c49ffe" stroke-width="1.6" stroke-linecap="round" marker-end="url(#b)"/><rect x="512" y="212" width="316" height="76" rx="12" fill="#2b3048" stroke="#c49ffe" stroke-width="1.5"/><text x="670" y="244" fill="#eef0ff" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Compiled program</text><text x="670" y="266" fill="#7485bd" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="middle">model.pte + delegates</text><line x1="330" y1="250" x2="506" y2="250" stroke="#c49ffe" stroke-width="1.6" stroke-linecap="round" marker-end="url(#b)"/><line x1="452" y1="24" x2="452" y2="344" stroke="#ff8b88" stroke-width="1.6" stroke-dasharray="7 6"/><g transform="translate(439,184) rotate(-90)"><text x="0" y="0" fill="#ff8b88" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GC visibility ends here</text></g><text x="24" y="366" fill="#abbcf5" font-family="Lexend, Aeonik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The handle is a few bytes the GC tracks. The allocation it points to is not, so it is freed only when you call dispose().</text></svg>
